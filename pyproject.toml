[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-mcp-server"
version = "0.1.0"
description = "Phased NBA statistics and performance evaluation MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["nba_api==1.11.4", "fastmcp==4.1.0"]

[project.scripts]
nba-mcp-server = "nba_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
